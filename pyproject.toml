[project]
name = "woodtex"
version = "0.2.0"
description = "Turn photos of wood grain into black/white texture masks and 3D-printable relief STL slabs"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-image>=0.24",
    "pillow>=10.0",
]

[project.scripts]
woodtex = "woodtex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "trimesh>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woodtex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
